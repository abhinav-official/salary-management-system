name: Salary system checks
on: [push, pull_request]
jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Backend scaffold tests
        run: |
          docker build --target test -t salary-api-tests api
          docker run --rm --mount "type=bind,source=$PWD/data,target=/fixtures,readonly" -e BAND_SAMPLE_WORKBOOK=/fixtures/employees_10000.xlsx salary-api-tests
      - name: Independent full-system acceptance and WAL backup restore
        run: python3 tools/acceptance_compose.py --report /tmp/salary-acceptance.json
      - name: Preserve acceptance timings
        uses: actions/upload-artifact@v4
        with:
          name: salary-acceptance-timings
          path: /tmp/salary-acceptance.json
      - name: Clean Compose build and deployment acceptance
        run: python3 tools/smoke_compose.py
  directory-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser test dependencies
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser acceptance through Compose and container recreation
        run: python3 tools/browser_compose.py
